<title>Agentic SfM Episodes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed episode rail on the left; the episode page is a two-column workbench, the trace on the left and the 3D model pinned on the right. */
:root {
  --bg: #eceff3; --surface: #ffffff; --surface-2: #e3e8ee; --fg: #151c24; --muted: #5a6673; --line: #cdd5de;
  --accent: #0b6e99; --accent-soft: #d9ecf5; --ok: #1f8a5b; --warn: #b8700a; --bad: #b83a2e;
  --viewer-bg: #0e141b; --viewer-grid: #22303d; --thinking-bg: #f4f1e8;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --surface: #161d24; --surface-2: #1f2932; --fg: #e4e9ee; --muted: #93a0ac; --line: #2a3541;
  --accent: #58b6e3; --accent-soft: #15364a; --ok: #4cc287; --warn: #e3a33a; --bad: #e46b5e;
  --viewer-bg: #090d11; --viewer-grid: #1b2630; --thinking-bg: #1c1f1a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1418; --surface: #161d24; --surface-2: #1f2932; --fg: #e4e9ee; --muted: #93a0ac; --line: #2a3541;
  --accent: #58b6e3; --accent-soft: #15364a; --ok: #4cc287; --warn: #e3a33a; --bad: #e46b5e;
  --viewer-bg: #090d11; --viewer-grid: #1b2630; --thinking-bg: #1c1f1a; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: var(--accent) }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.005em; text-wrap: balance; margin: 0 }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.eyebrow { font: 500 11px/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted) }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)) }
.rail { background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding-block: 18px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px }
.rail .brand { display: block; color: inherit; text-decoration: none; margin-bottom: 18px }
.rail .brand h1 { font-size: 20px; line-height: 1.15 }
.rail .brand .sub { font-size: 12px; color: var(--muted); margin-top: 4px }
.rail .group { margin-top: 16px }
.rail .group .eyebrow { margin: 0 0 6px 8px }
.rail .ep { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; color: inherit }
.rail .ep:hover { background: var(--surface-2) }
.rail .ep.current { background: var(--accent-soft); color: var(--fg) }
.rail .ep .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.rail .ep .s { font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex: none }
.picker { display: none }

main { min-width: 0; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1380px; margin: 0 auto }

/* overview */
.lede { max-width: 68ch; font-size: 15px }
.lede h2 { font-size: 30px; margin-bottom: 10px }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 22px 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0 }
.card .big { font: 600 26px/1.1 var(--font-display); margin: 6px 0 2px; font-variant-numeric: tabular-nums }
.card .big small { font: 500 13px/1 var(--font-body); color: var(--muted); margin-left: 6px }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: 0.02em }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-size: 13px }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin: 10px 0 24px }
.tablewrap table { min-width: 560px }
tr.link { cursor: pointer }
tr.link:hover td { background: var(--surface-2) }
.delta { font-family: var(--font-mono); font-size: 12px }
.delta.up { color: var(--ok) } .delta.down { color: var(--bad) } .delta.flat { color: var(--muted) }
.section h2 { font-size: 22px; margin: 26px 0 4px }
.section p { max-width: 70ch; color: var(--muted); margin: 0 0 8px }

/* episode */
.ep-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 6px }
.ep-head h2 { font-size: 30px }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--fg) }
.chip.accent { background: var(--accent-soft); color: var(--accent) }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 6px 0 14px; color: var(--muted); font-size: 13px }
.stats b { color: var(--fg); font-weight: 500; font-family: var(--font-mono) }
.scores { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-bottom: 18px }
.scores .note { font-size: 12px; color: var(--muted); margin: 6px 0 0 }
.work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 44%); gap: 20px; align-items: start }
.viewer-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px) }
.viewer { background: var(--viewer-bg); border-radius: 8px; border: 1px solid var(--line); aspect-ratio: 4 / 3; max-width: 100%; position: relative; overflow: hidden }
.viewer canvas { display: block; width: 100%; height: 100% }
.viewer .hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: #9fb0bf; pointer-events: none }
.vbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0 4px; font-size: 13px }
.vbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted) }
.vbar input[type=range] { width: 110px; accent-color: var(--accent) }
.vbar select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; max-width: 100% }
.vbar button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px }
.vmeta { font-size: 12px; color: var(--muted); font-family: var(--font-mono) }
.roundbar { margin-top: 8px }
.alignbox { margin-top: 10px }
.alignplot { margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.alignplot svg { width: 100%; height: auto; display: block; max-width: 100% }
.alignbox .growth svg { height: 120px }
.roundbar input[type=range] { width: 100%; accent-color: var(--accent) }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 4px; flex-wrap: wrap }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }

/* trace */
.trace { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px 12px; min-width: 0 }
.step.vlm { border-left: 3px solid var(--accent) }
.step.note { border-left: 3px solid var(--warn) }
.step .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 6px }
.step .head .name { font-family: var(--font-display); font-weight: 600; font-size: 16px }
.step .head .meta { font-size: 12px; color: var(--muted); font-family: var(--font-mono) }
.step .says { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 }
.thinking { background: var(--thinking-bg); border-radius: 6px; padding: 8px 10px; margin: 6px 0; font-size: 13px }
.thinking summary { cursor: pointer; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase }
.thinking .body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; color: var(--fg) }
.calls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px }
.call { font-family: var(--font-mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 3px 8px; overflow-wrap: anywhere }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 14px; font-size: 13px; margin: 4px 0 }
.kv dt { color: var(--muted); font-family: var(--font-mono); font-size: 12px } .kv dd { margin: 0; font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere }
details.raw summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-top: 4px }
pre { font: 12px/1.45 var(--font-mono); background: var(--surface-2); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 6px 0; max-height: 420px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px }
.thumbs button { padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); overflow: hidden; aspect-ratio: 4 / 3; max-width: 100% }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block }
.thumbs .cap { font-size: 11px; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.err { color: var(--bad); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere }

/* growth rounds */
.round.vlm { border-left: 3px solid var(--accent); cursor: default }
.rounds { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px }
.round { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 12px; padding: 6px 6px; border-radius: 6px; font-size: 13px; cursor: pointer }
.round:hover, .round.current { background: var(--surface-2) }
.round .lab { font-family: var(--font-display); font-weight: 600 }
.round .lab small { display: block; font: 11px/1.3 var(--font-mono); color: var(--muted); font-weight: 400 }
.round .body { min-width: 0 }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px }
.tag { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--fg) }
.tag.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok) }
.tag.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn) }
.tag.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad) }
.growth { margin: 6px 0 2px }
.growth svg { width: 100%; height: 72px; display: block; max-width: 100% }

dialog { border: 0; border-radius: 8px; padding: 0; background: var(--surface); color: var(--fg); max-width: min(96vw, 1200px); box-shadow: 0 10px 40px rgba(0,0,0,.4) }
dialog::backdrop { background: rgba(5, 10, 15, .7) }
dialog img { display: block; max-width: 96vw; max-height: 86vh }
dialog .cap { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; font-size: 12px; font-family: var(--font-mono); color: var(--muted) }
dialog .cap button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px }
.empty { color: var(--muted); padding: 20px 0 }

@media (max-width: 1080px) { .work { grid-template-columns: minmax(0, 1fr) } .viewer-col { position: static; order: -1 } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .rail { display: none }
  .picker { display: block; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
  .picker select { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px }
  .ep-head h2 { font-size: 24px }
}
@media (prefers-reduced-motion: no-preference) { .rail .ep, .round { transition: background .12s } }
</style>

<div class="picker"><select id="picker" aria-label="Choose an episode"></select></div>
<div class="app">
  <nav class="rail" id="rail" aria-label="Episodes">
    <a class="brand" href="#"><h1>Agentic SfM Episodes</h1><div class="sub">Open solver episodes, step by step, against ground truth</div></a>
  </nav>
  <main><div class="wrap" id="view"><div class="empty">Loading episodes…</div></div></main>
</div>
<dialog id="dlg"><div class="cap"><span id="dlgcap"></span><button id="dlgclose" type="button">Close</button></div><img id="dlgimg" alt=""></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var INDEX = null, VIEWER = null, CURRENT = null;
  var $ = function (s, el) { return (el || document).querySelector(s); };
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k === 'html') el.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c == null) return; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function fmt(v, d) { return (v == null || isNaN(v)) ? '–' : Number(v).toFixed(d == null ? 1 : d); }
  function metricsFor(ds) {
    return ds === 'eth3d' ? [['colmap_auc@1', 'AUC@1°'], ['colmap_auc@3', 'AUC@3°'], ['colmap_auc@5', 'AUC@5°']]
                          : [['auc_all@3', 'AUC@3°'], ['auc_all@10', 'AUC@10°']];
  }
  function primary(ds) { return ds === 'eth3d' ? 'colmap_auc@1' : 'auc_all@10'; }
  function delta(a, b) {
    if (a == null || b == null) return h('span', { class: 'delta flat', text: '' });
    var d = a - b, cls = Math.abs(d) < 0.05 ? 'flat' : (d > 0 ? 'up' : 'down');
    return h('span', { class: 'delta ' + cls, text: (d > 0 ? '+' : '') + d.toFixed(1) });
  }

  /* ---------------- rail ---------------- */
  function buildRail() {
    var rail = $('#rail'), pick = $('#picker');
    pick.appendChild(h('option', { value: '', text: 'Overview' }));
    INDEX.groups.forEach(function (g) {
      var box = h('div', { class: 'group' }, [h('div', { class: 'eyebrow', text: g.title })]);
      var og = h('optgroup', { label: g.title });
      g.episodes.forEach(function (id) {
        var ep = INDEX.episodes[id], sc = ep.score ? ep.score[primary(ep.dataset)] : null;
        box.appendChild(h('button', { class: 'ep', type: 'button', 'data-id': id, onclick: function () { location.hash = id; } },
          [h('span', { class: 't', text: ep.title }), h('span', { class: 's', text: fmt(sc) })]));
        og.appendChild(h('option', { value: id, text: ep.title + '  ·  ' + fmt(sc) }));
      });
      rail.appendChild(box); pick.appendChild(og);
    });
    pick.addEventListener('change', function () { location.hash = pick.value; });
  }
  function markCurrent(id) {
    document.querySelectorAll('.rail .ep').forEach(function (b) { b.classList.toggle('current', b.getAttribute('data-id') === id); });
    $('#picker').value = id || '';
  }

  /* ---------------- overview ---------------- */
  function showOverview() {
    CURRENT = null; markCurrent(null); if (VIEWER) { VIEWER.dispose(); VIEWER = null; }
    var v = $('#view'); v.innerHTML = '';
    var n = Object.keys(INDEX.episodes).length;
    v.appendChild(h('div', { class: 'lede' }, [
      h('div', { class: 'eyebrow', text: 'Open solver episodes · ' + n + ' scenes · exported ' + INDEX.generated }),
      h('h2', { text: 'An incremental solver with a VLM in the loop, checked against ground truth' }),
      h('p', { html: 'Each episode is one scene handed to the <b>open solver</b>: a Pi3X seed on the densest cluster, PnP growth in rounds verified against the matches, feedforward placement of the hard images with two anchor sets (the VLM arbitrates between render-and-compare figures when they disagree), a render audit of every camera, and separate models for image sets of another scene. Every pose comes from a tool; the VLM only gates which placement is kept. The step log below each 3D view shows every round, every hard placement with its reason, and every VLM question with the figures it saw and its answer.' }),
      h('p', { class: 'muted', text: 'Ground truth enters only here, in the benchmark layer, after the run: each model is aligned to the GT cameras with a robust similarity, GT cameras are drawn in the viewer with an error vector per camera, and the chart gives the per-image rotation error. WRIVA scores are the AUC of pairwise pose error over all image pairs (an unregistered image counts as wrong); ETH3D uses COLMAP\u2019s AUC at 1, 3 and 5 degrees.' })
    ]));
    var cards = h('div', { class: 'cards' });
    cards.appendChild(h('div', { class: 'card' }, [h('div', { class: 'eyebrow', text: 'ETH3D, 13 dev scenes · colmap_auc @1 / 3 / 5' }), h('div', { class: 'big', text: '66.1 / 86.8 / 91.8' }), h('div', { class: 'muted', text: 'open solver v1.3 · scripted COLMAP controller 66.7 / 87.1 / 91.9 · best fixed pipeline 60.4 / 83.5 / 89.5' })]));
    cards.appendChild(h('div', { class: 'card' }, [h('div', { class: 'eyebrow', text: 'ETH3D, 12 test scenes' }), h('div', { class: 'big', text: '65.2 / 84.3 / 88.6' }), h('div', { class: 'muted', text: 'scripted 70.5 / 89.3 / 93.5: the gap is old_computer (a mirrored block of 17 cameras, visible in its GT alignment) and lounge (precision)' })]));
    cards.appendChild(h('div', { class: 'card' }, [h('div', { class: 'eyebrow', text: 'WRIVA dev, 6 scenes · auc_all @10 / @3' }), h('div', { class: 'big', text: '56.5 / 21.5' }), h('div', { class: 'muted', text: 'scripted 59.7 / 22.5 · fixed 58.9 / 19.5 · the loss is the three PTZ scenes; BLH0001 and M07 are above both baselines' })]));
    v.appendChild(cards);
    INDEX.groups.forEach(function (g) {
      var sec = h('div', { class: 'section' }, [h('h2', { text: g.title })]);
      var ds0 = INDEX.episodes[g.episodes[0]].dataset;
      var hasEth = g.episodes.some(function (id) { return INDEX.episodes[id].dataset === 'eth3d'; });
      var hasWr = g.episodes.some(function (id) { return INDEX.episodes[id].dataset === 'wriva'; });
      sec.appendChild(h('p', { text: 'Same matches as the baseline controllers; the score is the submitted model (grown, then shared-intrinsics refinement). GT columns: median per-camera rotation error after alignment and the number of cameras more than 10 degrees off.' }));
      var head = h('tr', {}, [h('th', { text: 'Scene' }), h('th', { class: 'num', text: 'Images' }), h('th', { class: 'num', text: 'Registered' }),
        h('th', { class: 'num', text: hasEth && !hasWr ? 'AUC@1°' : (hasWr && !hasEth ? 'AUC@10°' : 'Primary') }), h('th', { class: 'num', text: 'vs scripted' }), h('th', { class: 'num', text: 'vs fixed' }),
        h('th', { class: 'num', text: 'GT median °' }), h('th', { class: 'num', text: 'GT > 10°' }), h('th', { class: 'num', text: 'Rounds · hard' }), h('th', { class: 'num', text: 'Wall s' })]);
      var tb = h('tbody');
      g.episodes.forEach(function (id) {
        var ep = INDEX.episodes[id], m = primary(ep.dataset), s = ep.score ? ep.score[m] : null;
        var sc = ep.refs && ep.refs.scripted ? ep.refs.scripted[m] : null, fx = ep.refs && ep.refs.fixed ? ep.refs.fixed[m] : null;
        tb.appendChild(h('tr', { class: 'link', onclick: function () { location.hash = id; } }, [
          h('td', { text: ep.title + (ep.dataset === 'eth3d' ? '' : '') }), h('td', { class: 'num', text: ep.num_images == null ? '–' : ep.num_images }),
          h('td', { class: 'num', text: ep.score ? ep.score.registered : '–' }), h('td', { class: 'num', text: fmt(s) }),
          h('td', { class: 'num' }, [delta(s, sc)]), h('td', { class: 'num' }, [delta(s, fx)]),
          h('td', { class: 'num', text: ep.gt_align ? fmt(ep.gt_align.median_rot_deg, 2) : '–' }), h('td', { class: 'num' }, [ep.gt_align ? h('span', { class: 'delta ' + (ep.gt_align.over_10 ? 'down' : 'flat'), text: String(ep.gt_align.over_10) + (ep.gt_align.unregistered ? ' +' + ep.gt_align.unregistered + ' missing' : '') }) : '–']),
          h('td', { class: 'num', text: ((ep.grow ? ep.grow.rounds : '–') + ' · ' + (ep.grow ? (ep.grow.hard_placed != null ? ep.grow.hard_placed : ep.grow.joins) : '–')) }),
          h('td', { class: 'num', text: ep.wall == null ? '–' : Math.round(ep.wall) })]));
      });
      sec.appendChild(h('div', { class: 'tablewrap' }, [h('table', {}, [h('thead', {}, [head]), tb])]));
      v.appendChild(sec);
    });
  }

  /* ---------------- episode ---------------- */
